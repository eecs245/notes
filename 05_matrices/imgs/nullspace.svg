<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100">
  <style>
    text { font-family: "Computer Modern", "Latin Modern Math", "STIX Two Math", serif; }
  </style>

  <!-- Input label: x -->
  <text x="40" y="56" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">x</text>

  <!-- Arrow: x -> A box -->
  <line x1="60" y1="50" x2="120" y2="50" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Box A -->
  <rect x="130" y="20" width="80" height="60" rx="4" ry="4" fill="none" stroke="black" stroke-width="2"/>
  <text x="170" y="56" font-size="24" font-weight="bold" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text>

  <!-- Arrow: A box -> output -->
  <line x1="210" y1="50" x2="270" y2="50" stroke="black" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Output label: 0 (zero vector) -->
  <text x="300" y="56" font-size="22" font-weight="bold" text-anchor="middle" dominant-baseline="middle">0</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>
