<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Large ellipse for vector space, now blue -->
  <ellipse cx="220" cy="150" rx="170" ry="120" fill="#e0f0ff" stroke="#2a4d8f" stroke-width="3"/>
  <!-- Smaller ellipse for subspace S, now light green -->
  <ellipse cx="160" cy="140" rx="80" ry="65" fill="#b6e3b6" stroke="#267326" stroke-width="3"/>
  <!-- Tiny elephants on top of the subspace S -->
  <g transform="translate(120,80) scale(0.18)">
    <!-- Simple stylized elephant, repeated for a "herd" effect -->
    <g>
      <ellipse cx="60" cy="60" rx="40" ry="25" fill="#888" stroke="#555" stroke-width="4"/>
      <ellipse cx="30" cy="70" rx="15" ry="10" fill="#888" stroke="#555" stroke-width="3"/>
      <ellipse cx="90" cy="70" rx="10" ry="8" fill="#888" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="80" rx="7" ry="5" fill="#888" stroke="#555" stroke-width="2"/>
      <ellipse cx="20" cy="90" rx="7" ry="5" fill="#888" stroke="#555" stroke-width="2"/>
      <ellipse cx="80" cy="50" rx="8" ry="8" fill="#888" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="60" rx="10" ry="6" fill="#888" stroke="#555" stroke-width="2"/>
      <!-- Trunk -->
      <path d="M 20 70 Q 5 80 20 100" stroke="#555" stroke-width="5" fill="none"/>
      <!-- Ear -->
      <ellipse cx="35" cy="55" rx="10" ry="15" fill="#aaa" stroke="#555" stroke-width="2"/>
      <!-- Eye -->
      <circle cx="25" cy="65" r="2" fill="#222"/>
    </g>
    <g transform="translate(60,20) scale(0.8)">
      <ellipse cx="60" cy="60" rx="40" ry="25" fill="#a9a9a9" stroke="#555" stroke-width="4"/>
      <ellipse cx="30" cy="70" rx="15" ry="10" fill="#a9a9a9" stroke="#555" stroke-width="3"/>
      <ellipse cx="90" cy="70" rx="10" ry="8" fill="#a9a9a9" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="80" rx="7" ry="5" fill="#a9a9a9" stroke="#555" stroke-width="2"/>
      <ellipse cx="20" cy="90" rx="7" ry="5" fill="#a9a9a9" stroke="#555" stroke-width="2"/>
      <ellipse cx="80" cy="50" rx="8" ry="8" fill="#a9a9a9" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="60" rx="10" ry="6" fill="#a9a9a9" stroke="#555" stroke-width="2"/>
      <path d="M 20 70 Q 5 80 20 100" stroke="#555" stroke-width="5" fill="none"/>
      <ellipse cx="35" cy="55" rx="10" ry="15" fill="#ccc" stroke="#555" stroke-width="2"/>
      <circle cx="25" cy="65" r="2" fill="#222"/>
    </g>
    <g transform="translate(30,30) scale(0.7)">
      <ellipse cx="60" cy="60" rx="40" ry="25" fill="#bdbdbd" stroke="#555" stroke-width="4"/>
      <ellipse cx="30" cy="70" rx="15" ry="10" fill="#bdbdbd" stroke="#555" stroke-width="3"/>
      <ellipse cx="90" cy="70" rx="10" ry="8" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="80" rx="7" ry="5" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
      <ellipse cx="20" cy="90" rx="7" ry="5" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
      <ellipse cx="80" cy="50" rx="8" ry="8" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
      <ellipse cx="100" cy="60" rx="10" ry="6" fill="#bdbdbd" stroke="#555" stroke-width="2"/>
      <path d="M 20 70 Q 5 80 20 100" stroke="#555" stroke-width="5" fill="none"/>
      <ellipse cx="35" cy="55" rx="10" ry="15" fill="#eee" stroke="#555" stroke-width="2"/>
      <circle cx="25" cy="65" r="2" fill="#222"/>
    </g>
  </g>
  <!-- Hatching for subspace S -->
  <!-- Label for S, subspace -->
  <text x="120" y="230" font-size="22" font-family="Avenir Light" fill="#267326" stroke="none" stroke-width="2" paint-order="stroke">subspace S</text>
  <!-- Label for vector space -->
  <text x="220" y="290" font-size="26" font-family="Avenir Light" fill="#2a4d8f">vector space V</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a4d8f"/>
    </marker>
  </defs>
</svg>